; BeginnerBot settings
; Copy to <StarCraft>\bwapi-data\AI\BeginnerBot.ini (or run BeginnerBotConfig.exe).
; The bot also looks in bwapi-data\read\BeginnerBot.ini. Missing file = defaults.

[bot]
; 1 = VeryEasy (매우 쉬움)  2 = Easy (쉬움)  3 = Normal (기본, default)
; 4 = Hard (어려움)         5 = VeryHard (매우 어려움)
difficulty = 3
; Only Terran is implemented. The race actually played is chosen in the game
; lobby or by bwapi.ini [auto_menu] race = Terran.
race = Terran
; liquipedia = openings per enemy race from Liquipedia's guides (default, 0.9.1):
;   vs Protoss / Terran: Factory before the second Barracks, Siege Mode and U-238 first
;   vs Zerg: Engineering Bay before the Factory, Stim / U-238 / +1 before Siege Mode
; classic = the difficulty's build and research order against every race (as in 0.8.8)
; Levels 2-5 (the levels that counter what they know) use it; level 1 always plays classic.
opening = liquipedia

[log]
; debug | info | warn | error
level = info
; Relative to the StarCraft folder (BWAPI's working directory).
directory = bwapi-data/write/BeginnerBot
; Periodic economy/army snapshot line in the log (720 frames = ~30 game seconds).
snapshot_interval_frames = 720

[game]
; -1 = leave the game speed alone, 0 = fastest (useful for repeated test games)
local_speed = -1
frame_skip = 0
; Draw the bot state on screen.
debug_draw = on
; Let a human also give orders / type chat (BWAPI blocks this by default).
enable_user_input = off
